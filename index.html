<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Time – Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --bg: #8db596; --accent: #ec87b5; --card: #ec87b5; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: var(--bg); 
            background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px); 
            background-size: 30px 30px; 
            transition: 0.5s; 
            overflow-x: hidden; 
            overflow-y: auto; /* يسمح بالتمرير إذا كانت الشاشة صغيرة جداً */
            position: relative; 
        }
        
        .char-container { 
            position: fixed; /* تغيير لضمان ثباتها خلف المحتوى */
            bottom: -20px; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            padding: 0 2%; 
            z-index: 1; 
            pointer-events: none; 
        }
        
        .char { 
            width: clamp(55px, 10vw, 105px); /* شخصيات خلفية أصغر للنسخة التجريبية */
            height: clamp(85px, 14vh, 115px); 
            border: 6px solid white; 
            border-bottom: none; 
            border-radius: 120px 120px 0 0; 
            position: relative; 
            opacity: 0.8;
        }
        
        .pink { background: #ec87b5; } .black { background: #2c3135; }
        .eye { width: clamp(20px, 5vw, 35px); height: clamp(20px, 5vw, 35px); background: white; border-radius: 50%; position: relative; }
        .pupil { width: 50%; height: 50%; background: black; border-radius: 50%; position: absolute; top: 25%; left: 25%; }
        
        .container { 
            z-index: 20; 
            width: 95%; 
            max-width: 1000px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 12px 10px;
        }
        
        .screen { display: none; flex-direction: column; align-items: center; gap: 15px; width: 100%; animation: pop 0.3s ease-out; }
        #start-screen { display: flex; }
        
        @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .title { 
            font-size: clamp(35px, 10vw, 80px); 
            color: white; 
            text-shadow: 4px 4px 0 var(--accent); 
            -webkit-text-stroke: 1.5px white; 
            margin: 10px 0; 
        }
        
        .btn { 
            background: white; 
            color: #333; 
            font-size: clamp(16px, 4vw, 20px); 
            font-weight: 900; 
            padding: 15px 20px; 
            border-radius: 25px; 
            border: none; 
            cursor: pointer; 
            box-shadow: 0 6px 0 rgba(0,0,0,0.1); 
            transition: 0.1s; 
            width: 80%;
            max-width: 300px; 
            margin: 5px; 
        }
        
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: clamp(5px, 2vw, 10px); 
            margin: 15px 0; 
            width: 100%;
            max-width: 420px;
        }
        
        .num-card { 
            background: var(--card); 
            color: white; 
            font-size: clamp(20px, 5vw, 28px); 
            font-weight: 900; 
            aspect-ratio: 1/1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-radius: clamp(10px, 3vw, 20px); 
            border: 3px solid white; 
            cursor: pointer; 
        }
        
        .opened { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .num-card.locked { opacity: 0.42; filter: grayscale(0.45); cursor: not-allowed; box-shadow: none; }
        #timer-box { font-size: 35px; font-weight: 900; color: white; background: rgba(0,0,0,0.2); padding: 5px 25px; border-radius: 50px; }
        
        .q-card { 
            background: var(--card); 
            color: white; 
            padding: 20px; 
            border-radius: 30px; 
            border: 6px solid white; 
            font-size: clamp(18px, 4.5vw, 22px); 
            font-weight: bold; 
            min-height: 125px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            line-height: 1.4; 
            width: 100%; 
            max-width: 500px; 
        }
        
        input { padding: 15px; border-radius: 15px; border: none; width: 90%; max-width: 300px; font-size: 18px; text-align: center; margin-bottom: 10px; }
        
        #home-btn { position: fixed; top: 20px; left: 20px; font-size: 30px; color: white; cursor: pointer; z-index: 100; display: none; text-decoration: none; user-select: none; background: rgba(0,0,0,0.1); padding: 5px; border-radius: 50%; }

        /* تعديل الشبكة للجوالات الصغيرة جداً */
        @media (max-width: 480px) { 
            .grid { grid-template-columns: repeat(4, 1fr); } 
            .btn { width: 90%; }
            .title { font-size: clamp(30px, 8vw, 54px); }
        }
    </style>
</head>
<body onmousemove="handleMove(event)" ontouchmove="handleMove(event)">

    <div id="home-btn" onclick="goHome()">🏠</div>

    <div class="char-container">
        <div class="char pink"><div style="display:flex;justify-content:center;gap:15px;margin-top:45px;"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div></div>
        <div class="char black"><div style="display:flex;justify-content:center;gap:15px;margin-top:45px;"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div></div>
    </div>

    <div class="container">
        <div id="start-screen" class="screen">
            <h1 class="title">QUIZ TIME</h1>
            <button class="btn" style="color:#ec87b5" onclick="startApp()">ابدأ اللعب</button>
        </div>

        <div id="mode-screen" class="screen">
            <h1 class="title" style="font-size: 35px;">اختر النظام</h1>
            <button class="btn" onclick="playSound('click'); setMode('single')">لعب فردي 👤</button>
            <button class="btn" onclick="playSound('click'); setMode('multi')">لعب مجموعات 👥</button>
            <button class="btn" style="background:#f1c40f; color:white;" onclick="playSound('click'); skipToCat()">لعب سريع (للجميع) ⚡</button>
        </div>

        <div id="name-screen" class="screen">
            <input type="text" id="name-in" placeholder="اكتب اسم اللاعب...">
            <div id="names-list" style="color:white; font-weight:bold; margin-bottom:10px;"></div>
            <div style="display:flex; gap:10px; flex-wrap: wrap; justify-content: center;">
                <button class="btn" style="min-width:120px; width: auto;" onclick="playSound('click'); addName()">إضافة +</button>
                <button class="btn" style="min-width:120px; width: auto; background:#ec87b5; color:white;" onclick="playSound('click'); showS('cat-screen')">التالي</button>
            </div>
        </div>

        <div id="cat-screen" class="screen">
            <h1 class="title" style="font-size: 35px;">نوع الجلسة</h1>
            <button class="btn" style="color:#ec87b5;" onclick="playSound('click'); initGame('girls', '#ec87b5')">جمعة بنات 💅</button>
            <button class="btn" style="color:#2e7d32;" onclick="playSound('click'); initGame('family', '#2e7d32')">جلسة عائلية ☕</button>
            <button class="btn" style="color:#e65100;" onclick="playSound('click'); initGame('challenges', '#e65100')">تحديات ⚡</button>
        </div>

        <div id="game-screen" class="screen">
            <div id="player-tag" style="background:white; padding:5px 25px; border-radius:50px; font-weight:900; color:var(--accent);"></div>
            <div class="grid" id="grid"></div>
        </div>

        <div id="q-screen" class="screen">
            <div id="timer-box">30</div>
            <div id="q-box" class="q-card"></div>
            <div style="display:flex; gap:10px; width: 100%; justify-content: center;">
                <button class="btn" style="background:#2ecc71; color:white; min-width:100px; width: 45%;" onclick="playSound('click'); finishQ()">تم ✅</button>
                <button id="pun-btn" class="btn" style="background:#333; color:white; min-width:100px; width: 45%;" onclick="playSound('click'); getPun()">عقاب ⚠️</button>
            </div>
        </div>
    </div>

    <script>
        const sounds = {
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            win: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'),
            pop: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3')
        };

        function playSound(name) {
            if (sounds[name]) {
                sounds[name].currentTime = 0;
                sounds[name].play().catch(e => console.log("الصوت محجوب"));
            }
        }

        function startApp() {
            playSound('click');
            showS('mode-screen');
        }

        function goHome() {
            playSound('click');
            clearInterval(timer);
            players = [];
            document.getElementById('names-list').innerText = "";
            document.getElementById('home-btn').style.display = 'none';
            document.body.style.backgroundColor = "#8db596";
            document.documentElement.style.setProperty('--accent', '#ec87b5');
            showS('start-screen');
        }

        let players = [], curIdx = 0, mode = '', currentQuestions = [], golds = [], timer, qPointer = 0;

        const allQuestions = {
            family: ["آخر مرة بكيت… ليه؟", "موقف صار لك مضحك وما تنساه", "ذكرى حلوة من الطفولة", "موقف صار لك وندمت عليه شوي", "أكثر شي كان يخوفك وأنت صغير", "موقف انحرجت فيه قدام الناس", "أكثر شي ضحكك بدون سبب", "يوم حسّيت إنك فخور بنفسك", "أغرب حلم حلمته", "شي نفسك ترجع له من أيام زمان", "موقف بسيط بس أثر فيك", "آخر مرة زعلت… إيش صار؟", "شي تعلمته من الحياة", "لو ترجع طفل يوم واحد… إإيش أول شي بتسويه؟", "مرة ضعت في مول أو سوبرماركت؟", "آخر مرة حسّيت بفرحة قوية؟", "شخص علّمك درس ما تنساه", "ذكرى مع العائلة تضحك", "أول صديق في حياتك", "موقف حسّيت فيه إنك محظوظ", "شي بسيط يسعدك", "شي كنت تخاف تسويه وسويته", "موقف حسّيت فيه إنك شجاع", "شي نفسك يصير في المستقبل"],
            girls: ["موقف خلاك قوية؟", "أكثر شي يخوفك بالعلاقات؟", "لو رجع الزمن، وش تغيرين؟", "شخص ندمتي إنك عرفتيه؟", "ودك تعتذري لمين؟", "أكثر ذكرى ما تنسيها؟", "أكثر شي يخليك تضحكين؟", "شي مستحيل تسامحين فيه؟", "لو بيدك تغيرين شي واحد في حياتك، وش بيكون؟", "أول صدمة في حياتك؟", "مين الشخص اللي ما تتحملين تشوفينه حزين؟", "مين آخر شخص قلتي له “أحبك” أو شي بنفس المعنى؟", "هل في قلبك حب الحين؟", "هل قد حبيتي حب حقيقي؟", "أكثر موقف خلاك تعيدين التفكير بنفسك بالكامل؟", "وش أكثر شي تحسينه ناقصك هالفترة؟ وليش؟", "هل في شي تتظاهرين إنك تخطيتيه، بس بالحقيقة للحين مأثر فيك؟", "متى تحسين نفسك أقوى نسخة منك؟", "هل تحسين إنك مفهومة من الناس حولك؟ وليش؟", "وش الشي اللي تتمنين أحد يفهمه فيك بدون ما تشرحين؟", "لو قلبك يقدر يتكلم الحين، وش بيقول؟", "هل في شخص للحين عالق في بالك رغم إنكم انتهيتوا؟", "وش أكثر شي يكسرك من داخل بس ما تبين لأحد؟", "متى آخر مرة بكيتي من قلب؟", "متى آخر مرة بكيتي من قلب؟ (وليش كانت مختلفة عن كل مرة؟)", "هل تحسين إنك تستحقين الحب اللي تبينه؟", "لو تقدرين ترسلين رسالة لشخص بدون ما يعرف إنها منك، وش بتقولين؟ ومين هو؟", "هل في شخص مستغنية عن حبه، بس تحتاجينه لدرجة تسايرينه؟", "أيهم أسوأ بالنسبة لك: شعور الغيرة ولا البعد؟ وليش؟"],
            challenges: [
                "دق على آخر مكالمة وقله أحبك", "دق على شخص وقله وش صوت القطار؟", "امشِ مشية عارض أزياء", "سوي نفسك مذيع 30 ثانية", "تكلم 30 ثانية بدون توقف", "إعلان لمنتج خيالي", "قل سر بسيط", "قلد حيوان بدون صوت", "كلمة اعتراف للي بيمينك", "كلمة اعتراف للي بيسارك", "احكي كذبة مقنعة", "تخيل الأرض حارة وامشِ", "ضحكة شرير 30 ثانية", "كل ليمونة بدون ما يتغير وجهك", "مين آخر شخص كنت تفكر فيه؟", "هل فيه شخص تغار عليه؟ ومن هو؟", "هل كذبت كذبة كبيرة قبل؟ وش كانت؟", "مين شخص ما تحبه بس تتعامل معه؟", "هل فيه شخص ندمت إنك عرفته؟", "متى آخر مرة بكيت؟ وليش؟", "هل سبق وحبيت من طرف واحد؟", "أكثر شي تخبيه عن الناس؟", "هل في شخص سويت نفسك نسيته بس للحين تفكر فيه؟", "وش أكثر شي تسويه بس تستحي تقول؟", "ارسل رسالة عشوائية لواحد من جهات اتصالك بدون شرح", "خل اللي جنبك يختار صورة من جوالك ويعرضها", "غني أغنية قديمة بصوت عالي", "سوِ رقصه عشوائية 20 ثانية", "قل سر محرج قدام الكل", "قلد شخص معروف قدامكم", "غير نبرة صوتك وتكلم دقيقة كاملة", "خل أحد يكتب لك رسالة وترسلها بدون ما تقرأها", "احكي موقف محرج صار لك بالتفصيل", "قول شي لطيف لواحد من الموجودين بس بشكل درامي"
            ]
        };

        const punList = [
            "غني هندي 🎤",
            "سوِّ صوت بسة جائعة 🐱",
            "قل نكتة بايخة 🤡",
            "مثّل مشهد درامي 🎭",
            "مثّل مشهد خوف 😨",
            "ارقص رقصة عشوائية بدون موسيقى 💃",
            "قل “أنا بطاطس” بـ5 مشاعر مختلفة 🥔",
            "سوِّ صوت دجاجة لمدة 30 ثانية 🐔",
            "غني أغنية حزينة بصوت مضحك 🎤",
            "قلّد مدرسك المفضل 😂",
            "قلّد واحد من الموجودين بدون ما تقول مين… وخليهم يخمّنون 👀",
            "سوِّ نفسك مذيع وقدّم فقرة لمدة 30 ثانية 🎤",
            "سوِّ إعلان إبداعي لشي عشوائي قدامك 📺",
            "مثّل إنك فزت بجائزة كبيرة وألقِ كلمة الفوز 🏆",
            "احكي موقف مضحك بأسلوب تمثيلي 😂",
            "تكلم بلهجة مختلفة (مصري/شامي/بدوي) لمدة دقيقة 🗣️"
        ];

        function showS(id) { 
            document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); 
            document.getElementById(id).style.display='flex'; 
            if(id !== 'start-screen') {
                document.getElementById('home-btn').style.display = 'block';
            }
        }
        
        function setMode(m) { mode = m; showS('name-screen'); }
        function skipToCat() { mode = 'quick'; players = ['الجميع']; showS('cat-screen'); }

        function addName() {
            const input = document.getElementById('name-in');
            if(input.value.trim()){
                players.push(input.value.trim());
                document.getElementById('names-list').innerText = players.join(" - ");
                input.value = "";
            }
        }

        function initGame(cat, color) {
            let list = [...allQuestions[cat]];
            list.sort(() => Math.random() - 0.5);
            currentQuestions = list.slice(0, 20);
            qPointer = 0;
            document.body.style.backgroundColor = color;
            document.documentElement.style.setProperty('--accent', color);
            document.documentElement.style.setProperty('--card', color);
            golds = []; 
            while(golds.length < 1){ 
                let r = Math.floor(Math.random() * 3) + 1; 
                if(!golds.includes(r)) golds.push(r); 
            }
            const g = document.getElementById('grid'); g.innerHTML='';
            for(let i=1; i<=20; i++) {
                if(i <= 3) {
                    g.innerHTML+=`<div class="num-card" id="n${i}" onclick="openN(${i})">${i}</div>`;
                } else {
                    g.innerHTML+=`<div class="num-card locked" id="n${i}" aria-disabled="true">${i}</div>`;
                }
            }
            updateTurn();
            showS('game-screen');
        }

        function updateTurn() { document.getElementById('player-tag').innerText = "دور: " + (players[curIdx] || "اللاعب"); }

        function openN(n) {
            const card = document.getElementById('n'+n);
            card.classList.add('opened');
            document.getElementById('pun-btn').style.display = 'block';
            
            if(golds.includes(n)) {
                playSound('win');
                confetti();
                document.getElementById('q-box').innerHTML = "✨ كرت ذهبي ✨<br>تخطي أو اطلب من غيرك!";
                startT(0);
            } else {
                playSound('pop');
                let q = currentQuestions[qPointer] || "ما هو أكثر شيء يجعلك سعيداً؟";
                document.getElementById('q-box').innerText = q;
                qPointer++;
                startT(30);
            }
            showS('q-screen');
        }

        function startT(s) {
            clearInterval(timer);
            if(s===0){ document.getElementById('timer-box').style.display='none'; return; }
            document.getElementById('timer-box').style.display='block';
            let left = s; document.getElementById('timer-box').innerText = left;
            timer = setInterval(()=>{ left--; document.getElementById('timer-box').innerText=left; if(left<=0) clearInterval(timer); }, 1000);
        }

        function finishQ() {
            playSound('click');
            clearInterval(timer);
            if(mode !== 'quick') curIdx = (curIdx + 1) % players.length;
            updateTurn();
            showS('game-screen');
        }

        function getPun() {
            playSound('click');
            document.getElementById('q-box').innerText = "⚠️ عقاب: " + punList[Math.floor(Math.random()*punList.length)];
            document.getElementById('pun-btn').style.display = 'none';
        }

        function handleMove(e) {
            const pupils = document.querySelectorAll('.pupil');
            const cx = (e.clientX || (e.touches ? e.touches[0].clientX : 0));
            const cy = (e.clientY || (e.touches ? e.touches[0].clientY : 0));
            pupils.forEach(p => {
                const r = p.getBoundingClientRect();
                const x = (cx - (r.left + r.width/2)) / 10; 
                const y = (cy - (r.top + r.height/2)) / 10;
                p.style.transform = `translate(${Math.max(-5, Math.min(5, x))}px, ${Math.max(-5, Math.min(5, y))}px)`;
            });
        }
    </script>
</body>
</html>
